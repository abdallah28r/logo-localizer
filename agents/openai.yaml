interface:
  display_name: "Logo Localizer"
  short_description: "Translate logos and titles of games, films, series, anime, books and comics into another language in the same artistic style, Arabic first, with strict letter checks"
  default_prompt: "Use logo-localizer to translate the logo in this image (to Arabic unless I name another language); this call alone is the request. First show the full analysis card and translation card, then end your turn and wait: I choose the text. Before the cards, read the skill's references, start a job folder, research the work and its logo on the web (titles, story, trusted logo copies, design statements, published translations, all with sources) and analyse the logo from the whole down to each letter with its neighbours; write everything into job.json and pass the self-check; before my reply, generate no images. After it: add my text and four styles of your choice to job.json, run job_spec.py check (show the preflight), then the clean plate, four transparent logo layers each placed on it, shown as four separate numbered images with the options to pick a number or ask for four more (close to the original, or more inventive); wait for my answer, then letter and mark tables on the chosen one. After I accept: ask me where to save, save into a new folder there, then ask before permanently deleting the working files."
