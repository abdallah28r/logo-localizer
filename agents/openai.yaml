interface:
  display_name: "Logo Localizer"
  short_description: "Translate logos and titles of games, films, series, anime, books and comics into another language in the same artistic style, Arabic first, with strict letter checks"
  default_prompt: "Use logo-localizer to translate the logo in this image (to Arabic unless I name another language); this call alone is the request. First show the full analysis card and translation card, then end your turn and wait: I choose the text. Before my reply, create no files and generate no images. After it: job folder, job.json with four styles of your choice and job_spec.py check (show the preflight), then the clean plate, four transparent logo layers each placed on it, shown as four separate numbered images with the options to pick a number or ask for four more (close to the original, or more inventive); wait for my answer, then letter and mark tables on the chosen one. After I accept: ask me where to save, save into a new folder there, then ask before permanently deleting the working files."
